# Release van Toolkit SD
#
# Start bij elk versielabel vX.Y.Z (bv. git tag v1.4.2 && git push origin v1.4.2).
# 1. bouwt de zip en info.json (bin/build.py)
# 2. controleert dat het label overeenkomt met de versie in toolkit-sd.php
# 3. maakt de GitHub-release met de zip en info.json als bijlagen
# 4. controleert dat de sites ze kunnen ophalen via releases/latest/download/
#
# De sites lezen https://github.com/Sonora-design/Toolkit-SD/releases/latest/download/info.json.
# Daarvoor moet de repository publiek zijn. Geen secrets nodig.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bouwen
        run: python3 bin/build.py

      - name: Label en versie vergelijken
        id: v
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('dist/info.json'))['version'])")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Label $GITHUB_REF_NAME komt niet overeen met versie $VERSION in toolkit-sd.php"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Changelog van deze versie als releasetekst.
          awk -v v="## $VERSION " 'index($0,v)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > dist/notes.md
          sha256sum "dist/toolkit-sd-$VERSION.zip"

      - name: GitHub-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          gh release create "$GITHUB_REF_NAME" "dist/toolkit-sd-$V.zip" dist/info.json \
            --title "Toolkit SD $V" --notes-file dist/notes.md --verify-tag --latest

      - name: Controleren zoals een site het ziet
        run: |
          V=${{ steps.v.outputs.version }}
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases"
          sleep 5
          if ! curl -fsSL -A "Toolkit-SD" "$BASE/latest/download/info.json" -o online.json; then
            echo "::error::info.json is niet publiek bereikbaar. Is de repository publiek?"
            exit 1
          fi
          ONLINE_V=$(python3 -c "import json;print(json.load(open('online.json'))['version'])")
          ONLINE_SHA=$(python3 -c "import json;print(json.load(open('online.json'))['sha256'])")
          URL=$(python3 -c "import json;print(json.load(open('online.json'))['download_url'])")
          curl -fsSL -A "Toolkit-SD" "$URL" -o online.zip
          ZIP_SHA=$(sha256sum online.zip | cut -d' ' -f1)
          echo "online versie $ONLINE_V, controlesom info.json $ONLINE_SHA, zip $ZIP_SHA"
          [ "$ONLINE_V" = "$V" ] || { echo "::error::laatste release toont $ONLINE_V in plaats van $V"; exit 1; }
          [ "$ONLINE_SHA" = "$ZIP_SHA" ] || { echo "::error::controlesom van de zip klopt niet met info.json"; exit 1; }
          echo "Toolkit SD $V staat online. Sites zien de update binnen 12 uur." >> "$GITHUB_STEP_SUMMARY"
